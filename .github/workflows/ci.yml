name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: SPM tests
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package:
          - Packages/CoreKit
          - Packages/SecurityKit
          - Packages/NetworkKit
          - Packages/LLMKit
          - Packages/AgentKit
          - Packages/MemoryKit
          - Packages/PluginKit
          - Packages/PluginRuntimeJS
          - Packages/PluginRuntimeMCP
          - Packages/MarketplaceKit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Test ${{ matrix.package }}
        run: |
          swift test --package-path "${{ matrix.package }}" \
            --enable-code-coverage 2>&1 | tee "test-$(basename ${{ matrix.package }}).log"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ strategy.job-index }}
          path: test-*.log

  app:
    name: Build & test app
    runs-on: macos-15
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd Amore && xcodegen generate
      - name: Build (iOS)
        run: |
          cd Amore
          xcodebuild -project Amore.xcodeproj -scheme Amore \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Test (macOS)
        run: |
          cd Amore
          xcodebuild test -project Amore.xcodeproj -scheme Amore \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES

  lint:
    name: SwiftLint
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging
