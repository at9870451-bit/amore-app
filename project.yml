name: Amore
options:
  bundleIdPrefix: app.amore
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  CoreKit:          { path: Packages/CoreKit }
  DesignSystem:     { path: Packages/DesignSystem }
  SecurityKit:      { path: Packages/SecurityKit }
  NetworkKit:       { path: Packages/NetworkKit }
  LLMKit:           { path: Packages/LLMKit }
  PluginKit:        { path: Packages/PluginKit }
  AgentKit:         { path: Packages/AgentKit }
  MemoryKit:        { path: Packages/MemoryKit }
  PluginRuntimeJS:  { path: Packages/PluginRuntimeJS }
  PluginRuntimeMCP: { path: Packages/PluginRuntimeMCP }
  MarketplaceKit:   { path: Packages/MarketplaceKit }
  Chat:             { path: Packages/Features/Chat }
  Marketplace:      { path: Packages/Features/Marketplace }
  PluginManager:    { path: Packages/Features/PluginManager }
  Memory:           { path: Packages/Features/Memory }
  Settings:         { path: Packages/Features/Settings }

targets:
  Amore:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "18.0"
      macOS: "15.0"
    sources:
      - path: App
    info:
      path: App/Info.plist
    dependencies:
      - package: CoreKit
      - package: DesignSystem
      - package: SecurityKit
      - package: NetworkKit
      - package: LLMKit
      - package: PluginKit
      - package: AgentKit
      - package: MemoryKit
      - package: PluginRuntimeJS
      - package: PluginRuntimeMCP
      - package: MarketplaceKit
      - package: Chat
      - package: Marketplace
      - package: PluginManager
      - package: Memory
      - package: Settings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.amore.client
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"